name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping_render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Render app
        run: |
          RENDER_URL="https://my-userbot-8.onrender.com/ping"
          echo "Pinging ${RENDER_URL}..."
          curl -s -o /dev/null "${RENDER_URL}"
          echo "Ping successful at $(date)"
